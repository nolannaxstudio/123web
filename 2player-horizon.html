<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2 Player Horizon</title>

<style>
/* ===== RESET ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

/* ⚠️ PAS DE BACKGROUND ICI */
body{
  font-family: Arial, sans-serif;
  color:white;
  overflow-x:hidden;
}

/* ===== FOND GLOBAL (COMME NOLANNAX) ===== */
.hero-bg,
.hero-glow,
.hero-overlay{
  position:fixed; /* 🔥 IMPORTANT */
  inset:0;
  pointer-events:none;
}

.hero-bg{
  background:radial-gradient(
    circle at center,
    rgba(59,130,246,0.35),
    rgba(11,15,27,1) 70%
  );
  filter:blur(45px);
  z-index:-3;
  animation:bgMove 12s ease-in-out infinite;
}

.hero-glow{
  background:radial-gradient(
    circle at center,
    rgba(255,255,255,0.12),
    transparent 65%
  );
  z-index:-2;
  animation:glow 6s ease-in-out infinite;
}

.hero-overlay{
  background:linear-gradient(
    180deg,
    rgba(0,0,0,0.55),
    rgba(0,0,0,0.95)
  );
  z-index:-1;
}

@keyframes bgMove{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(30px);}
}
@keyframes glow{
  0%,100%{opacity:.35;}
  50%{opacity:.75;}
}

/* ===== PAGE ===== */
.page{
  min-height:100vh;
  position:relative;
  z-index:1;
}

/* ===== CONTENT ===== */
.content{
  max-width:1100px;
  margin:auto;
  padding:80px 40px;
  text-align:center;
}

/* ===== GAME CARD ===== */
.game-card{
  background:rgba(255,255,255,0.03);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 0 30px rgba(59,130,246,0.35);
  transition:.3s;
  max-width:320px;
  margin:auto;
}
.game-card:hover{
  transform:translateY(-8px);
  box-shadow:0 0 45px rgba(59,130,246,0.6);
}
.game-card img{
  width:100%;
  display:block;
}
.game-card-content{
  padding:20px;
}
.game-card h1{
  font-size:22px;
  margin-bottom:10px;
}
.game-card p{
  font-size:14px;
  opacity:.85;
  line-height:1.5;
}

/* ===== BOUTON ===== */
.btn-roblox{
  display:inline-block;
  margin-top:15px;
  background:#e2231a;
  color:white;
  font-weight:bold;
  padding:10px 22px;
  border-radius:6px;
  text-decoration:none;
  transition:.2s;
}
.btn-roblox:hover{
  background:#b71c1c;
  transform:translateY(-2px);
}

/* ===== INFOS ===== */
.info{
  margin-top:50px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.info-card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:14px;
  padding:20px;
}

/* ===== NEWS ===== */
.news{
  margin-top:60px;
  text-align:left;
}
.news-item{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
}
.news-item span{
  font-size:13px;
  opacity:.7;
}
</style>
</head>

<body>

<!-- 🔥 FOND GLOBAL -->
<div class="hero-bg"></div>
<div class="hero-glow"></div>
<div class="hero-overlay"></div>

<div class="page">
  <div class="content">

    <div class="game-card">
      <img src="game1.png" alt="2 Player Horizon">
      <div class="game-card-content">
        <h1>2 Player Horizon</h1>
        <p>
          Jeu coopératif à 2 joueurs.<br>
          Rouge = joueur rouge, bleu = joueur bleu.<br>
          Coopérez pour finir l’obby 🌟
        </p>

        <a href="https://www.roblox.com/games/ID_DU_JEU"
           target="_blank"
           class="btn-roblox">
          ▶ JOUER SUR ROBLOX
        </a>
      </div>
    </div>

    <div class="info">
      <div class="info-card">
        <strong>🎮 Mode</strong>
        <p>Coopération</p>
      </div>
      <div class="info-card">
        <strong>🎯 Objectif</strong>
        <p>Finir l’obby</p>
      </div>
      <div class="info-card">
        <strong>🎨 Gameplay</strong>
        <p>Système de couleurs</p>
      </div>
    </div>

    <div class="news">
      <h2>📰 News</h2>
      <div class="news-item">
        <strong>📌 En développement</strong>
        <p>Nouveaux niveaux en préparation.</p>
        <span>À venir</span>
      </div>
    </div>

  </div>
</div>

</body>
</html>
