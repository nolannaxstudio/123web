<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nolannax Studios</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <img src="logo.png" class="nav-logo">
    <span>Nolannax Studios</span>
  </div>
  <ul class="nav-links">
    <li>Home</li>
    <li>Our Games</li>
    <li>About Us</li>
    <li>Contact</li>
  </ul>
</nav>

<!-- HERO COMME DO BIG -->
<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <img src="logo.png" class="hero-logo">
    <h1>Nolannax Studios</h1>

    <div class="hero-buttons">
      <a class="btn primary">Explore our games</a>
      <a class="btn secondary">Talk to us</a>
    </div>

    <div class="stats">
      <div>
        <h2>432 539</h2>
        <p>Players playing our games</p>
      </div>
      <div>
        <h2>109.7B+</h2>
        <p>Total play sessions</p>
      </div>
    </div>
  </div>
</section>

<!-- CONTENU NORMAL -->
<section class="content">
  <h2>Nos Jeux</h2>
  <p>Bientôt disponibles.</p>
</section>

</body>
</html>
